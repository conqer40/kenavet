<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>KENAVET — تطبيق العمليات الميدانية</title>
  <style>
    :root {
      --brand: #176b55;
      --bg: #091310;
      --text: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .logo {
      width: 72px;
      height: 72px;
      background: var(--brand);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      font-weight: 900;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px rgba(23, 107, 85, 0.5);
    }
    h1 { font-size: 24px; margin-bottom: 8px; }
    p { font-size: 14px; color: #94a3b8; margin-bottom: 24px; line-height: 1.5; }
    .loader {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #10b981;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .config-box {
      margin-top: 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 16px;
      border-radius: 12px;
      width: 100%;
      max-width: 340px;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #fff;
      font-size: 14px;
      margin-bottom: 10px;
      direction: ltr;
      text-align: center;
    }
    button {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: var(--brand);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }
    .author {
      margin-top: 30px;
      font-size: 11px;
      color: #64748b;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="logo">K</div>
  <h1>KENAVET</h1>
  <p>جارٍ الاتصال بنظام العمليات الميدانية...</p>
  <div class="loader" id="spinner"></div>

  <div class="config-box" id="configBox" style="display:none;">
    <p style="font-size:12px;margin-bottom:10px;">عنوان الخادم (Server URL):</p>
    <input type="url" id="serverInput" value="http://192.168.1.6:3000" placeholder="http://192.168.1.6:3000">
    <button onclick="saveAndConnect()">اتصال الآن</button>
  </div>

  <div class="author">برمجة وتطوير: محمد الحاوي © KENAVET</div>

  <script>
    const defaultUrl = 'http://192.168.1.6:3000';
    const targetUrl = localStorage.getItem('kenavet_server_url') || defaultUrl;
    document.getElementById('serverInput').value = targetUrl;

    function tryConnect() {
      fetch(targetUrl + '/api/data', { mode: 'no-cors' })
        .then(() => {
          location.href = targetUrl;
        })
        .catch(() => {
          document.getElementById('spinner').style.display = 'none';
          document.getElementById('configBox').style.display = 'block';
        });

      // Timeout fallback to show config
      setTimeout(() => {
        if (location.href.indexOf(targetUrl) === -1) {
          document.getElementById('configBox').style.display = 'block';
        }
      }, 3500);
    }

    function saveAndConnect() {
      const url = document.getElementById('serverInput').value.trim();
      if (url) {
        localStorage.setItem('kenavet_server_url', url);
        location.href = url;
      }
    }

    tryConnect();
  </script>
</body>
</html>
